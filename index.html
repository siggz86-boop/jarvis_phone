<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#040201">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Argus</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --a:#ff7a1a; --a2:#ffb067; --fg:#f3ece6; --dim:#a3968c; --line:rgba(255,255,255,.1); --edge:rgba(255,140,60,.35); --head:"Michroma", system-ui, sans-serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; background:#040201; color:var(--fg); font:16px/1.45 Inter, system-ui, -apple-system, Roboto, sans-serif; overscroll-behavior:none; overflow:hidden; }
  #scene { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .ui { position:fixed; inset:0; display:flex; flex-direction:column; padding:calc(10px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom)); pointer-events:none; }
  .ui > * { pointer-events:auto; }
  header { display:flex; flex-direction:column; gap:10px; }
  .brand { font:18px/1 var(--head); letter-spacing:.34em; text-align:center; padding-top:4px; }
  .chips { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .chips button { background:rgba(8,5,3,.6); border:1px solid var(--line); color:var(--dim); border-radius:999px; padding:5px 11px; font:12px Inter, sans-serif; }
  .chips button.on { color:var(--fg); border-color:var(--edge); }
  .chips button.on::before { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--a); box-shadow:0 0 6px var(--a); margin-right:6px; vertical-align:1px; }
  .spacer { flex:1; pointer-events:none; }
  .talk { text-align:center; text-shadow:0 2px 10px #000, 0 0 2px #000; pointer-events:none; padding:0 4px 12px; }
  #status { font:10px/1 var(--head); letter-spacing:.45em; color:var(--a2); min-height:12px; margin-bottom:10px; }
  #live { color:var(--a2); font-style:italic; min-height:20px; font-size:14px; }
  #youline { color:#c7bcb3; font-size:14px; }
  #reply { color:#fff; font-size:17px; line-height:1.45; margin-top:4px; max-height:5.9em; overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; }
  #logbtn { pointer-events:auto; background:none; border:0; color:var(--dim); font:11px Inter, sans-serif; letter-spacing:.08em; margin-top:8px; padding:6px 10px; }
  form { display:flex; gap:8px; align-items:center; height:52px; padding:0 6px 0 16px; border:1px solid rgba(255,255,255,.25); border-radius:14px; background:rgba(8,5,3,.75); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  form:focus-within { border-color:var(--a2); }
  form input { flex:1; min-width:0; background:none; border:0; outline:none; color:var(--fg); font:16px Inter, sans-serif; }
  form input::placeholder { color:#b7aba2; }
  #orb { width:42px; height:42px; border-radius:11px; border:0; background:none; color:#eee; display:grid; place-items:center; }
  [data-state="listening"] #orb { background:var(--a); color:#fff; box-shadow:0 0 18px var(--a); }
  #send { display:none; }
  #toast { position:fixed; left:50%; top:calc(96px + env(safe-area-inset-top)); transform:translateX(-50%); width:max-content; max-width:88vw; padding:9px 14px; border-radius:10px; background:rgba(20,10,4,.92); border:1px solid var(--edge); font-size:14px; text-align:center; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.show { opacity:1; }
  #sheet { position:fixed; left:0; right:0; bottom:0; height:62vh; transform:translateY(105%); transition:transform .25s ease; background:linear-gradient(180deg, rgba(22,13,8,.96), rgba(8,5,3,.98)); border-top:1px solid var(--edge); border-radius:16px 16px 0 0; padding:14px 14px calc(84px + env(safe-area-inset-bottom)); z-index:3; }
  #sheet.open { transform:none; }
  #log { height:100%; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:88%; padding:9px 13px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; font-size:15px; }
  .you { align-self:flex-end; background:rgba(255,122,26,.18); border:1px solid rgba(255,122,26,.3); }
  .jarvis { align-self:flex-start; background:rgba(255,255,255,.05); border:1px solid var(--line); }
  .note { align-self:center; color:var(--dim); font-size:13px; text-align:center; }
  .meta { display:block; font-size:11px; color:#6f645c; margin-top:4px; }
  #bottom { position:relative; z-index:4; }
  #gate { position:fixed; inset:0; z-index:9; background:radial-gradient(circle at 50% 35%, rgba(255,110,25,.18), #040201 60%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; }
  #gate p { color:var(--dim); max-width:320px; }
  #gate input { width:100%; max-width:320px; background:rgba(8,5,3,.8); border:1px solid rgba(255,255,255,.25); color:var(--fg); border-radius:12px; padding:12px; font-size:16px; }
  #gate button { width:100%; max-width:320px; background:var(--a); color:#fff; border:none; border-radius:12px; padding:12px; font-size:16px; box-shadow:0 0 22px rgba(255,122,26,.4); }
  .hidden { display:none !important; }
</style>
</head>
<body data-state="idle">
<canvas id="scene" aria-hidden="true"></canvas>
<div id="gate">
  <div style="font:26px/1 Michroma, sans-serif;letter-spacing:.3em">ARGUS</div>
  <p>Your passphrase, sir. It's only asked once on this phone.</p>
  <input id="pass" type="password" autocomplete="current-password" placeholder="passphrase">
  <button id="passgo">Let me in</button>
  <p id="passerr" style="color:#ff9a8a"></p>
</div>

<div class="ui">
  <header>
    <div class="brand">ARGUS</div>
    <div class="chips">
      <button id="mode">home</button>
      <button id="mute">Voice on</button>
      <button id="hp" title="Use the headphone button to talk">Headset</button>
      <button id="voice" title="Tap to try the next phone voice">Phone voice</button>
    </div>
  </header>
  <div class="spacer"></div>
  <div class="talk">
    <div id="status"></div>
    <div id="live"></div>
    <div id="youline"></div>
    <div id="reply"></div>
    <button id="logbtn" type="button">CONVERSATION</button>
  </div>
  <div id="bottom">
    <form id="form" autocomplete="off">
      <input id="text" type="text" placeholder="Ask me anything…" aria-label="Ask Argus">
      <button id="orb" type="button" aria-label="Talk to Argus"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <button id="send" type="submit">Send</button>
    </form>
  </div>
</div>
<div id="toast" role="status"></div>
<div id="sheet"><div id="log"></div></div>

<script>
const RELAY = location.hostname.endsWith("supabase.co") ? "./" : "https://swwmgxcjzgdukrwsrwnt.supabase.co/functions/v1/phone/";
const $ = (id) => document.getElementById(id);
const logEl = $("log"), liveEl = $("live"), statusEl = $("status"), textEl = $("text");
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
let PASS = store.get("jarvis-pass") || "";
let mode = store.get("jarvis-mode") || "home";
let muted = store.get("jarvis-muted") === "1";
let busy = false, listening = false, state = "idle";
const hdrs = (extra) => Object.assign({ "X-Jarvis-Pass": PASS }, extra || {});

// ---------- gate ----------
function showGate(msg) { $("gate").classList.remove("hidden"); $("passerr").textContent = msg || ""; }
async function tryPass(p) {
  const r = await fetch(RELAY + "ping", { method: "POST", headers: { "X-Jarvis-Pass": p } });
  return r.ok;
}
$("passgo").onclick = async () => {
  const p = $("pass").value.trim();
  if (!p) return;
  if (await tryPass(p)) { PASS = p; store.set("jarvis-pass", p); $("gate").classList.add("hidden"); hello(); }
  else showGate("That isn't it, sir.");
};
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") $("passgo").onclick(); });

// ---------- transcript ----------
const LABEL = { idle: "", listening: "LISTENING", thinking: "THINKING", speaking: "SPEAKING" };
function setState(s) { state = s; document.body.dataset.state = s; if (s !== "thinking") statusEl.textContent = LABEL[s] || ""; else if (!statusEl.textContent || statusEl.textContent === "THINKING") statusEl.textContent = "THINKING"; }
function addMsg(who, text, meta) {
  const div = document.createElement("div"); div.className = "msg " + who;
  const body = document.createElement("span"); body.textContent = text; div.appendChild(body);
  if (meta) setMeta(div, meta);
  logEl.appendChild(div); logEl.scrollTop = logEl.scrollHeight;
  if (who === "you") { $("youline").textContent = "“" + text + "”"; $("reply").textContent = ""; }
  if (who === "jarvis" && text) $("reply").textContent = text;
  if (who === "note") toast(text);
  return div;
}
function setMeta(div, text) {
  let m = div.querySelector(".meta");
  if (!m) { m = document.createElement("span"); m.className = "meta"; div.appendChild(m); }
  m.textContent = text;
}

// ---------- header buttons ----------
function showMode() { $("mode").textContent = mode; $("mode").classList.toggle("on", mode === "office"); }
showMode();
$("mode").onclick = () => { mode = mode === "home" ? "office" : "home"; store.set("jarvis-mode", mode); showMode(); };
function showMute() { $("mute").textContent = muted ? "Voice off" : "Voice on"; $("mute").classList.toggle("on", !muted); }
showMute();
$("mute").onclick = () => { muted = !muted; showMute(); if (muted) stopSpeaking(); store.set("jarvis-muted", muted ? "1" : "0"); };

// ---------- voice out ----------
let voices = [];
function loadVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); showVoice(); }; }
function englishVoices() {
  const rank = (v) => (/en[-_]GB/i.test(v.lang) ? 0 : /en[-_]AU/i.test(v.lang) ? 1 : /^en/i.test(v.lang) ? 2 : 9);
  return voices.filter(v => rank(v) < 9).sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
}
function pickVoice() {
  const list = englishVoices();
  const wanted = store.get("jarvis-voice");
  if (wanted) { const hit = list.find(v => v.name === wanted); if (hit) return hit; }
  return list.find(v => /male/i.test(v.name) && !/female/i.test(v.name)) || list[0] || null;
}
function showVoice() {
  const v = pickVoice();
  $("voice").textContent = v ? v.name.replace(/^(Google|Microsoft|Samsung)\s*/i, "").slice(0, 14) : "Phone voice";
}
$("voice").onclick = () => {
  const list = englishVoices();
  if (!list.length) { addMsg("note", "No voices on this phone yet. Android: Settings > General > Text-to-speech to install some."); return; }
  const cur = pickVoice();
  const next = list[(Math.max(0, list.indexOf(cur)) + 1) % list.length];
  store.set("jarvis-voice", next.name); showVoice();
  stopSpeaking(); serverVoice = false; queueSpeech("Good evening, sir. How does this one sound?"); serverVoice = true;
};
function forSpeech(t) { return t.replace(/https?:\/\/\S+/g, "the link on screen").replace(/[*_#`>|]/g, "").replace(/^\s*[-•]\s+/gm, "").replace(/\s+/g, " ").trim(); }
function splitSentences(text, final) {
  const out = []; let rest = text;
  for (;;) {
    const m = rest.match(/^([\s\S]*?[.!?](?:["')\]]+)?)(\s+|\n+)/);
    if (!m) break;
    out.push(m[1]); rest = rest.slice(m[0].length);
  }
  if (final && rest.trim()) { out.push(rest); rest = ""; }
  return [out, rest];
}
let speechQueue = [], speaking = false, speechGen = 0, audioEl = null, serverVoice = true;
let voiceAnalyser = null, micLevel = 0;   // loudness, for the sphere
function watchVoice(el) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaElementSource(el);
    voiceAnalyser = audioCtx.createAnalyser(); voiceAnalyser.fftSize = 512;
    src.connect(voiceAnalyser); voiceAnalyser.connect(audioCtx.destination);
  } catch (e) { voiceAnalyser = null; }
}
function settle() { setState(busy ? "thinking" : "idle"); }
function stopSpeaking() {
  stopBarge();
  speechGen++; speechQueue = []; speaking = false;
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (audioEl) { audioEl.pause(); audioEl = null; }
  if (state === "speaking") settle();
}
// Each sentence's voice is fetched as soon as it's queued, so the next one is ready when this one ends.
function ttsFetch(item) {
  if (!item || item.p || !serverVoice) return;
  item.p = fetch(RELAY + "tts", { method: "POST", headers: hdrs({ "Content-Type": "application/json" }), body: JSON.stringify({ text: item.text }) })
    .then(async (r) => { if (r.status === 200) return await r.blob(); if (r.status === 204) serverVoice = false; return null; })
    .catch(() => null);
}
function queueSpeech(text) {
  if (muted) return; const s = forSpeech(text); if (!s) return;
  const item = { text: s }; speechQueue.push(item);
  if (speechQueue.length <= 2) ttsFetch(item);
  if (!speaking) playNext();
}
async function playNext() {
  const gen = speechGen, item = speechQueue.shift();
  if (!item) { speaking = false; stopBarge(); settle(); maybeFollowUp(); return; }
  const say = item.text;
  speaking = true; setState("speaking"); startBarge();
  const next = () => { if (gen === speechGen) playNext(); };
  ttsFetch(item); ttsFetch(speechQueue[0]);
  if (item.p) {
    try {
      const blob = await item.p;
      if (gen !== speechGen) return;
      if (blob) {
        const url = URL.createObjectURL(blob);
        audioEl = new Audio(url);
        watchVoice(audioEl);
        audioEl.onended = () => { URL.revokeObjectURL(url); audioEl = null; voiceAnalyser = null; next(); };
        audioEl.onerror = next;
        await audioEl.play(); return;
      }
    } catch (e) {}
  }
  if (!window.speechSynthesis) { next(); return; }
  const u = new SpeechSynthesisUtterance(say);
  const v = pickVoice(); if (v) u.voice = v;
  u.lang = "en-GB"; u.rate = 1.0;
  u.onend = u.onerror = next;
  speechSynthesis.speak(u);
}

// ---------- talking to Argus ----------
// The last few exchanges go with each message so quick replies keep the thread,
// and anything said by the quick side is passed on to the full Argus.
let hist = [];
function sinceAgent() {
  const out = [];
  for (let i = hist.length - 1; i >= 0 && hist[i].quick; i--) out.unshift({ role: hist[i].role, text: hist[i].text });
  return out;
}
async function send(text, channel) {
  text = (text || "").trim();
  if (!text || busy) return;
  busy = true; followPending = channel === "voice"; stopSpeaking();
  addMsg("you", text); setState("thinking");
  const started = performance.now();
  const bubble = addMsg("jarvis", ""), body = bubble.firstChild;
  let shown = "", pending = "", firstWords = null, ack = "", wasQuick = false;
  const take = (final) => { const [s, rest] = splitSentences(pending, final); pending = rest; s.forEach(queueSpeech); };
  const handle = (ev) => {
    if (ev.type === "ack") {
      if (firstWords === null) firstWords = (performance.now() - started) / 1000;
      ack = ev.text; body.textContent = ack; $("reply").textContent = ack; queueSpeech(ack);
    } else if (ev.type === "delta") {
      if (firstWords === null) firstWords = (performance.now() - started) / 1000;
      shown += ev.text; body.textContent = ack ? ack + "\n\n" + shown.replace(/^\s+/, "") : shown; $("reply").textContent = shown; pending += ev.text; take(false); logEl.scrollTop = logEl.scrollHeight;
    } else if (ev.type === "status") { if (state === "thinking") statusEl.textContent = ev.text; }
    else if (ev.type === "done") {
      if (!shown.trim() && ev.reply) { shown = ev.reply; body.textContent = shown; $("reply").textContent = shown; pending = ev.reply; }
      take(true);
      const secs = ((performance.now() - started) / 1000).toFixed(1);
      const first = firstWords !== null ? `first words ${firstWords.toFixed(1)}s · ` : "";
      const tools = (ev.tools || []).length ? ` · used ${[...new Set(ev.tools)].join(", ")}` : "";
      wasQuick = !!ev.quick;
      setMeta(bubble, `${first}done ${secs}s${tools}${wasQuick ? " · quick reply" : ""}`);
    }
  };
  try {
    const r = await fetch(RELAY + "chat", { method: "POST", headers: hdrs({ "Content-Type": "application/json" }), body: JSON.stringify({ text, channel, mode, history: hist.slice(-12).map((h) => ({ role: h.role, text: h.text })), since_agent: sinceAgent() }) });
    if (r.status === 401) { bubble.remove(); showGate("Passphrase needed again, sir."); return; }
    if (!r.ok) { let why = ""; try { why = (await r.json()).error || ""; } catch (e) {} throw new Error(why || ("relay " + r.status)); }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl; while ((nl = buf.indexOf("\n")) >= 0) { const line = buf.slice(0, nl); buf = buf.slice(nl + 1); if (line.trim()) { try { handle(JSON.parse(line)); } catch (e) {} } }
    }
  } catch (e) {
    if (!shown) bubble.remove();
    addMsg("note", "I can't reach my brain just now, sir. " + (e && e.message && !/^relay|Failed to fetch|NetworkError/i.test(e.message) ? "The relay said: " + e.message : "Check the phone has signal and try again."));
  } finally {
    if (shown.trim()) {
      hist.push({ role: "brad", text, quick: wasQuick }, { role: "argus", text: shown.trim(), quick: wasQuick });
      if (hist.length > 30) hist = hist.slice(-30);
    }
    busy = false; if (!speaking) { settle(); maybeFollowUp(); }
  }
}
$("form").onsubmit = (e) => { e.preventDefault(); const t = textEl.value; textEl.value = ""; send(t, "typed"); };

// ---------- voice in, live: stream to Deepgram while he talks ----------
let micStream = null, recorder = null, chunks = [], recStarted = 0, cancelRec = false;
let live = null, liveOK = true;
async function getMic() {
  if (!micStream || !micStream.active) micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  return micStream;
}
async function startListening(opts = {}) {
  if (busy || listening) return;
  stopSpeaking();
  if (liveOK && window.WebSocket && window.MediaRecorder) { startLive(opts); return; }
  startRecorded(opts);
}
async function startLive(opts) {
  listening = true; setState("listening");
  liveEl.textContent = opts.followUp ? "Go on, sir…" : "";
  if (navigator.vibrate) navigator.vibrate(30);
  let tok = null;
  try {
    const r = await fetch(RELAY + "stt-token", { method: "POST", headers: hdrs() });
    if (r.status === 401) { listening = false; setState("idle"); showGate("Passphrase needed again, sir."); return; }
    if (r.status === 200) tok = (await r.json()).token;
  } catch (e) {}
  const fallback = () => { listening = false; liveOK = false; startRecorded(opts); };
  if (!tok) { fallback(); return; }
  try { await getMic(); }
  catch (e) { listening = false; setState("idle"); addMsg("note", "Argus needs the microphone. Allow it for this app in Android settings, then try again."); return; }
  const q = new URLSearchParams({ model: "nova-3", language: "en", smart_format: "true", punctuate: "true",
    interim_results: "true", endpointing: "500", utterance_end_ms: "1000", vad_events: "true" });
  ["Argus", "SMG", "Holden", "Commodore", "Repco", "Supabase", "Bedford", "Nolathane"].forEach((w) => q.append("keyterm", w));
  let ws;
  try { ws = new WebSocket("wss://api.deepgram.com/v1/listen?" + q, ["bearer", tok]); } catch (e) { fallback(); return; }
  const L = live = { ws, final: "", interim: "", done: false, heard: false, opened: false, rec: null, timers: [] };
  startVAD(micStream, { meterOnly: true });
  L.timers.push(setTimeout(() => { if (!L.heard) finishLive(L, true); }, opts.followUp ? 6000 : 8000));
  L.timers.push(setTimeout(() => finishLive(L, false), 60000));
  ws.onopen = () => {
    L.opened = true;
    const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : (MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "");
    L.rec = new MediaRecorder(micStream, mime ? { mimeType: mime } : undefined);
    L.rec.ondataavailable = (e) => { if (e.data.size && ws.readyState === 1) ws.send(e.data); };
    L.rec.start(100);
  };
  ws.onmessage = (m) => {
    let d; try { d = JSON.parse(m.data); } catch (e) { return; }
    if (d.type === "Results") {
      const alt = d.channel && d.channel.alternatives && d.channel.alternatives[0];
      const t = (alt && alt.transcript) || "";
      if (t) L.heard = true;
      if (d.is_final) { if (t) L.final += (L.final ? " " : "") + t; L.interim = ""; } else L.interim = t;
      liveEl.textContent = (L.final + " " + L.interim).trim();
      if (d.speech_final && L.final.trim()) finishLive(L, false);
    } else if (d.type === "UtteranceEnd") { if (L.final.trim()) finishLive(L, false); }
  };
  ws.onerror = () => { if (!L.opened && !L.done) { L.done = true; cleanupLive(L); live = null; fallback(); } };
  ws.onclose = () => { if (!L.done) finishLive(L, false); };
}
function cleanupLive(L) {
  L.timers.forEach(clearTimeout);
  try { if (L.rec && L.rec.state !== "inactive") L.rec.stop(); } catch (e) {}
  try { if (L.ws.readyState === 1) L.ws.send(JSON.stringify({ type: "CloseStream" })); L.ws.close(); } catch (e) {}
  stopVAD();
}
function finishLive(L, cancelled) {
  if (L.done) return;
  L.done = true; cleanupLive(L);
  if (live === L) live = null;
  listening = false;
  const said = cancelled ? "" : (L.final + " " + L.interim).trim();
  liveEl.textContent = "";
  if (!said) { setState("idle"); return; }
  send(said, "voice");
}

// ---------- talking over him (headset mode) ----------

    for (let i = 0; i < PTS.length; i += step) {
      const p = PTS[i];
      const [x, y, z, f] = rot(p);
      const depth = 0.25 + 0.75 * (1 - (z + 1) / 2);
      g.globalAlpha = depth * (p.hot ? 1 : 0.85);
      const s = p.size * f * (p.hot ? 3.4 : 2.8);
      g.drawImage(p.hot ? DOT_HOT : p.white ? DOT_WHITE : DOT_ORANGE, x - s / 2, y - s / 2, s, s);
    }
    // web between the bright nodes
    g.lineWidth = 0.7;
    for (const [a, b] of LINKS) {
      const A = rot(a), B = rot(b);
      g.globalAlpha = 0.28 * (0.3 + 0.7 * (1 - (A[2] + 1) / 2));
      g.strokeStyle = "rgb(255,225,200)";
      g.beginPath(); g.moveTo(A[0], A[1]); g.lineTo(B[0], B[1]); g.stroke();
    }
    for (const n of NODES) {
      const [x, y, z, f] = rot(n);
      const depth = 0.3 + 0.7 * (1 - (z + 1) / 2);
      g.globalAlpha = depth * (0.7 + 0.3 * Math.sin(time * 2 + n.tw));
      const s = n.size * f * 7;
      g.drawImage(DOT_HOT, x - s / 2, y - s / 2, s, s);
    }

    // orbits
    for (const o of ORBITS) {
      const ci = Math.cos(o.inc), si = Math.sin(o.inc), cn = Math.cos(o.node + spin * 0.4), sn = Math.sin(o.node + spin * 0.4);
      const pos = (th) => {
        let x = Math.cos(th) * o.k, y = 0, z = Math.sin(th) * o.k;
        const y2 = -z * si, z2 = z * ci; z = z2; y = y2;
        const x3 = x * cn - y * sn, y3 = x * sn + y * cn;
        return rot({ x: x3, y: y3, z });
      };
      g.globalAlpha = o.alpha * (0.6 + energy * 0.5);
      g.strokeStyle = "rgb(255,232,212)"; g.lineWidth = 1;
      g.beginPath();
      for (let i = 0; i <= 96; i++) { const [x, y] = pos(i / 96 * TAU); i ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.stroke();
      for (let r = 0; r < o.riders.length; r++) {
        o.riders[r] += o.speed * dt * (0.6 + energy * 1.6);
        const [x, y, z, f] = pos(o.riders[r]);
        g.globalAlpha = 0.6 + 0.4 * (1 - (z + 1) / 2);
        const s = 12 * f;
        g.drawImage(DOT_HOT, x - s / 2, y - s / 2, s, s);
      }
    }
    g.globalAlpha = 1;

    // floor fade
    g.globalCompositeOperation = "source-over";
    gr = g.createLinearGradient(0, H * 0.78, 0, H);
    gr.addColorStop(0, "rgba(4,2,1,0)"); gr.addColorStop(1, "rgba(4,2,1,.9)");
    g.fillStyle = gr; g.fillRect(0, H * 0.78, W, H * 0.22);

    // bloom: a small, blurred copy of the frame added back on top
    bg.globalCompositeOperation = "source-over";
    bg.filter = "none";
    bg.clearRect(0, 0, bloom.width, bloom.height);
    bg.drawImage(cv, 0, 0, bloom.width, bloom.height);
    b2.clearRect(0, 0, blur1.width, blur1.height); b2.filter = "blur(2.5px)"; b2.drawImage(bloom, 0, 0);
    b3.clearRect(0, 0, blur2.width, blur2.height); b3.filter = "blur(4px)"; b3.drawImage(bloom, 0, 0, blur2.width, blur2.height);
    g.globalCompositeOperation = "lighter";
    g.globalAlpha = 0.75; g.drawImage(blur1, 0, 0, W, H);
    g.globalAlpha = 0.65; g.drawImage(blur2, 0, 0, W, H);
    g.globalAlpha = 1; g.globalCompositeOperation = "source-over";

    // Keep it smooth on slower PCs: thin the particles if frames get slow.
    slow = slow * 0.95 + (dt > 0.03 ? 1 : 0) * 0.05;
    if (slow > 0.6 && quality > 0.4) { quality -= 0.1; slow = 0; }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Tap the sphere to talk.
  const onSphere = (e) => Math.hypot(e.clientX - cx, e.clientY - cy) < R * 1.05;
  cv.addEventListener("mousemove", (e) => cv.classList.toggle("hot", onSphere(e)));
  cv.addEventListener("click", (e) => { if (onSphere(e)) toggle(); });
})();
</script>
</body>
</html>
