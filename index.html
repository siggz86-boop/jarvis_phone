<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07090f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jarvis</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root { --bg:#07090f; --fg:#e8ecf4; --dim:#7d8799; --you:#1b2436; --jar:#121a2a; --note:#2a2238; --glow:#4fa3ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior:none; }
  body { display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); }
  header { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; font-size:13px; color:var(--dim); }
  header b { color:var(--fg); font-weight:600; letter-spacing:.08em; }
  header button { background:none; border:1px solid #243049; color:var(--dim); border-radius:999px; padding:4px 10px; font-size:12px; margin-left:6px; }
  header button.on { color:var(--fg); border-color:var(--glow); }
  #log { flex:1; overflow-y:auto; padding:6px 14px 12px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:88%; padding:9px 13px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word; }
  .you { align-self:flex-end; background:var(--you); border-bottom-right-radius:4px; }
  .jarvis { align-self:flex-start; background:var(--jar); border-bottom-left-radius:4px; }
  .note { align-self:center; background:var(--note); color:#c9c0dc; font-size:13px; text-align:center; }
  .meta { display:block; font-size:11px; color:var(--dim); margin-top:4px; }
  #live { min-height:22px; text-align:center; color:var(--dim); font-size:14px; padding:0 16px; }
  #status { text-align:center; font-size:13px; color:var(--glow); min-height:18px; }
  #bottom { padding:10px 16px calc(14px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; align-items:center; gap:10px; }
  #orb { width:96px; height:96px; border-radius:50%; border:none; background:radial-gradient(circle at 35% 35%, #8cc4ff, #2b6fd6 55%, #0b2a5e); box-shadow:0 0 28px rgba(79,163,255,.35); transition:transform .15s, box-shadow .3s; }
  #orb:active { transform:scale(.95); }
  body.listening #orb { box-shadow:0 0 48px rgba(255,90,90,.6); background:radial-gradient(circle at 35% 35%, #ffb3b3, #e04848 55%, #5e0b0b); }
  body.thinking #orb { animation:pulse 1.2s ease-in-out infinite; }
  body.speaking #orb { box-shadow:0 0 56px rgba(79,163,255,.7); }
  @keyframes pulse { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.06);} }
  form { display:flex; width:100%; gap:8px; }
  input[type=text], input[type=password] { flex:1; background:#0e1422; border:1px solid #243049; color:var(--fg); border-radius:12px; padding:10px 12px; font-size:16px; }
  form button { background:#1b2436; color:var(--fg); border:none; border-radius:12px; padding:0 14px; font-size:15px; }
  #gate { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; }
  #gate p { color:var(--dim); max-width:320px; }
  #gate input { width:100%; max-width:320px; }
  #gate button { width:100%; max-width:320px; background:#2b6fd6; color:#fff; border:none; border-radius:12px; padding:12px; font-size:16px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="gate">
  <div style="font-size:28px;font-weight:600;letter-spacing:.1em">JARVIS</div>
  <p>Your passphrase, sir. It's only asked once on this phone.</p>
  <input id="pass" type="password" autocomplete="current-password" placeholder="passphrase">
  <button id="passgo">Let me in</button>
  <p id="passerr" style="color:#ff8a8a"></p>
</div>

<header>
  <b>JARVIS</b>
  <span>
    <button id="mode">home</button>
    <button id="mute">Voice on</button>
    <button id="hp" title="Use the headphone button to talk">Headset</button>
    <button id="voice" title="Tap to try the next voice">Voice</button>
  </span>
</header>
<div id="log"></div>
<div id="status"></div>
<div id="live"></div>
<div id="bottom">
  <button id="orb" aria-label="Talk to Jarvis"></button>
  <form id="form"><input id="text" type="text" placeholder="or type…" autocomplete="off"><button type="submit">Send</button></form>
</div>

<script>
const RELAY = location.hostname.endsWith("supabase.co") ? "./" : "https://swwmgxcjzgdukrwsrwnt.supabase.co/functions/v1/phone/";
const $ = (id) => document.getElementById(id);
const logEl = $("log"), liveEl = $("live"), statusEl = $("status"), textEl = $("text");
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
let PASS = store.get("jarvis-pass") || "";
let mode = store.get("jarvis-mode") || "home";
let muted = store.get("jarvis-muted") === "1";
let busy = false, listening = false, state = "idle";
const hdrs = (extra) => Object.assign({ "X-Jarvis-Pass": PASS }, extra || {});

// ---------- gate ----------
function showGate(msg) { $("gate").classList.remove("hidden"); $("passerr").textContent = msg || ""; }
async function tryPass(p) {
  const r = await fetch(RELAY + "ping", { method: "POST", headers: { "X-Jarvis-Pass": p } });
  return r.ok;
}
$("passgo").onclick = async () => {
  const p = $("pass").value.trim();
  if (!p) return;
  if (await tryPass(p)) { PASS = p; store.set("jarvis-pass", p); $("gate").classList.add("hidden"); hello(); }
  else showGate("That isn't it, sir.");
};
$("pass").addEventListener("keydown", (e) => { if (e.key === "Enter") $("passgo").onclick(); });

// ---------- transcript ----------
function setState(s) { state = s; document.body.className = s; if (s !== "thinking") statusEl.textContent = ""; }
function addMsg(who, text, meta) {
  const div = document.createElement("div"); div.className = "msg " + who;
  const body = document.createElement("span"); body.textContent = text; div.appendChild(body);
  if (meta) setMeta(div, meta);
  logEl.appendChild(div); logEl.scrollTop = logEl.scrollHeight; return div;
}
function setMeta(div, text) {
  let m = div.querySelector(".meta");
  if (!m) { m = document.createElement("span"); m.className = "meta"; div.appendChild(m); }
  m.textContent = text;
}

// ---------- header buttons ----------
function showMode() { $("mode").textContent = mode; $("mode").classList.toggle("on", mode === "office"); }
showMode();
$("mode").onclick = () => { mode = mode === "home" ? "office" : "home"; store.set("jarvis-mode", mode); showMode(); };
function showMute() { $("mute").textContent = muted ? "Voice off" : "Voice on"; }
showMute();
$("mute").onclick = () => { muted = !muted; showMute(); if (muted) stopSpeaking(); store.set("jarvis-muted", muted ? "1" : "0"); };

// ---------- voice out ----------
let voices = [];
function loadVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); showVoice(); }; }
function englishVoices() {
  const rank = (v) => (/en[-_]GB/i.test(v.lang) ? 0 : /en[-_]AU/i.test(v.lang) ? 1 : /^en/i.test(v.lang) ? 2 : 9);
  return voices.filter(v => rank(v) < 9).sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
}
function pickVoice() {
  const list = englishVoices();
  const wanted = store.get("jarvis-voice");
  if (wanted) { const hit = list.find(v => v.name === wanted); if (hit) return hit; }
  return list.find(v => /male/i.test(v.name) && !/female/i.test(v.name)) || list[0] || null;
}
function showVoice() {
  const v = pickVoice();
  $("voice").textContent = v ? "Voice: " + v.name.replace(/^(Google|Microsoft|Samsung)\s*/i, "").slice(0, 18) : "Voice";
}
$("voice").onclick = () => {
  const list = englishVoices();
  if (!list.length) { addMsg("note", "No voices on this phone yet. Android: Settings > General > Text-to-speech to install some."); return; }
  const cur = pickVoice();
  const next = list[(Math.max(0, list.indexOf(cur)) + 1) % list.length];
  store.set("jarvis-voice", next.name); showVoice();
  stopSpeaking(); serverVoice = false; queueSpeech("Good evening, sir. How does this one sound?"); serverVoice = true;
};
function forSpeech(t) { return t.replace(/https?:\/\/\S+/g, "the link on screen").replace(/[*_#`>|]/g, "").replace(/^\s*[-•]\s+/gm, "").replace(/\s+/g, " ").trim(); }
function splitSentences(text, final) {
  const out = []; let rest = text;
  for (;;) {
    const m = rest.match(/^([\s\S]*?[.!?](?:["')\]]+)?)(\s+|\n+)/);
    if (!m) break;
    out.push(m[1]); rest = rest.slice(m[0].length);
  }
  if (final && rest.trim()) { out.push(rest); rest = ""; }
  return [out, rest];
}
let speechQueue = [], speaking = false, speechGen = 0, audioEl = null, serverVoice = true;
function settle() { setState(busy ? "thinking" : "idle"); }
function stopSpeaking() {
  speechGen++; speechQueue = []; speaking = false;
  if (window.speechSynthesis) speechSynthesis.cancel();
  if (audioEl) { audioEl.pause(); audioEl = null; }
  if (state === "speaking") settle();
}
function queueSpeech(text) { if (muted) return; const s = forSpeech(text); if (!s) return; speechQueue.push(s); if (!speaking) playNext(); }
async function playNext() {
  const gen = speechGen, say = speechQueue.shift();
  if (!say) { speaking = false; settle(); return; }
  speaking = true; setState("speaking");
  const next = () => { if (gen === speechGen) playNext(); };
  if (serverVoice) {
    try {
      const r = await fetch(RELAY + "tts", { method: "POST", headers: hdrs({ "Content-Type": "application/json" }), body: JSON.stringify({ text: say }) });
      if (gen !== speechGen) return;
      if (r.status === 200) {
        const url = URL.createObjectURL(await r.blob());
        audioEl = new Audio(url);
        audioEl.onended = () => { URL.revokeObjectURL(url); audioEl = null; next(); };
        audioEl.onerror = next;
        await audioEl.play(); return;
      }
      if (r.status === 204) serverVoice = false;
    } catch (e) {}
  }
  if (!window.speechSynthesis) { next(); return; }
  const u = new SpeechSynthesisUtterance(say);
  const v = pickVoice(); if (v) u.voice = v;
  u.lang = "en-GB"; u.rate = 1.0;
  u.onend = u.onerror = next;
  speechSynthesis.speak(u);
}

// ---------- talking to Jarvis ----------
async function send(text, channel) {
  text = (text || "").trim();
  if (!text || busy) return;
  busy = true; stopSpeaking();
  addMsg("you", text); setState("thinking"); statusEl.textContent = "Thinking…";
  const started = performance.now();
  const bubble = addMsg("jarvis", ""), body = bubble.firstChild;
  let shown = "", pending = "", firstWords = null;
  const take = (final) => { const [s, rest] = splitSentences(pending, final); pending = rest; s.forEach(queueSpeech); };
  const handle = (ev) => {
    if (ev.type === "delta") {
      if (firstWords === null) firstWords = (performance.now() - started) / 1000;
      shown += ev.text; body.textContent = shown; pending += ev.text; take(false); logEl.scrollTop = logEl.scrollHeight;
    } else if (ev.type === "status") { if (state === "thinking") statusEl.textContent = ev.text; }
    else if (ev.type === "done") {
      if (!shown.trim() && ev.reply) { shown = ev.reply; body.textContent = shown; pending = ev.reply; }
      take(true);
      const secs = ((performance.now() - started) / 1000).toFixed(1);
      const first = firstWords !== null ? `first words ${firstWords.toFixed(1)}s · ` : "";
      const tools = (ev.tools || []).length ? ` · used ${[...new Set(ev.tools)].join(", ")}` : "";
      setMeta(bubble, `${first}done ${secs}s${tools}`);
    }
  };
  try {
    const r = await fetch(RELAY + "chat", { method: "POST", headers: hdrs({ "Content-Type": "application/json" }), body: JSON.stringify({ text, channel, mode }) });
    if (r.status === 401) { bubble.remove(); showGate("Passphrase needed again, sir."); return; }
    if (!r.ok) { let why = ""; try { why = (await r.json()).error || ""; } catch (e) {} throw new Error(why || ("relay " + r.status)); }
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl; while ((nl = buf.indexOf("\n")) >= 0) { const line = buf.slice(0, nl); buf = buf.slice(nl + 1); if (line.trim()) { try { handle(JSON.parse(line)); } catch (e) {} } }
    }
  } catch (e) {
    if (!shown) bubble.remove();
    addMsg("note", "I can't reach my brain just now, sir. " + (e && e.message && !/^relay|Failed to fetch|NetworkError/i.test(e.message) ? "The relay said: " + e.message : "Check the phone has signal and try again."));
  } finally { busy = false; if (!speaking) settle(); }
}
$("form").onsubmit = (e) => { e.preventDefault(); const t = textEl.value; textEl.value = ""; send(t, "typed"); };

// ---------- voice in: record here, transcribe on the relay ----------
let micStream = null, recorder = null, chunks = [], recStarted = 0, cancelRec = false;
async function startListening() {
  if (busy || listening) return;
  stopSpeaking();
  if (!navigator.mediaDevices || !window.MediaRecorder) { addMsg("note", "This browser can't record. Use Chrome, or type."); return; }
  try { if (!micStream || !micStream.active) micStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { addMsg("note", "Jarvis needs the microphone. Allow it for this app in Android settings, then try again."); return; }
  const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : (MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "");
  chunks = []; cancelRec = false;
  recorder = new MediaRecorder(micStream, mime ? { mimeType: mime } : undefined);
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = finishRecording;
  recorder.start(250); recStarted = performance.now();
  listening = true; setState("listening"); liveEl.textContent = "Listening… tap again when you're done";
  if (navigator.vibrate) navigator.vibrate(30);
}
function stopListening() { if (listening && recorder && recorder.state === "recording") recorder.stop(); }
async function finishRecording() {
  listening = false;
  const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" }); chunks = [];
  const cancelled = cancelRec; cancelRec = false;
  if (cancelled || performance.now() - recStarted < 400 || blob.size < 2000) { liveEl.textContent = ""; setState("idle"); return; }
  liveEl.textContent = "Working out what you said…"; setState("thinking");
  try {
    const r = await fetch(RELAY + "stt", { method: "POST", headers: hdrs({ "Content-Type": blob.type }), body: blob });
    liveEl.textContent = "";
    if (r.status === 401) { setState("idle"); showGate("Passphrase needed again, sir."); return; }
    const { text } = await r.json();
    if (text) send(text, "voice"); else { setState("idle"); addMsg("note", "I didn't catch that, sir."); }
  } catch (e) { liveEl.textContent = ""; setState("idle"); addMsg("note", "I couldn't send that to be transcribed. Signal?"); }
}
function toggle() { if (listening) stopListening(); else if (state === "speaking") stopSpeaking(); else startListening(); }
$("orb").onclick = toggle;

// ---------- headphone button ----------
// Playing a silent loop lets the headset's play/pause button reach this page
// (and keeps the page alive when the screen is off).
let silent = null, hpOn = false;
function makeSilence() {
  const ctx = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(1, 44100 * 2, 44100);
  return ctx.startRendering().then((buf) => {
    const wav = toWav(buf); return URL.createObjectURL(new Blob([wav], { type: "audio/wav" }));
  });
}
function toWav(buf) {
  const n = buf.length, out = new ArrayBuffer(44 + n * 2), v = new DataView(out);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt "); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 44100, true); v.setUint32(28, 88200, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, n * 2, true);
  return out;
}
$("hp").onclick = async () => {
  if (hpOn) { if (silent) silent.pause(); hpOn = false; $("hp").classList.remove("on"); return; }
  try {
    if (!silent) { silent = new Audio(await makeSilence()); silent.loop = true; silent.volume = 0.01; }
    await silent.play();
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: "Jarvis", artist: "Press play/pause to talk" });
      for (const a of ["play", "pause", "nexttrack", "previoustrack"]) {
        try { navigator.mediaSession.setActionHandler(a, () => { silent.play(); toggle(); }); } catch (e) {}
      }
    }
    hpOn = true; $("hp").classList.add("on");
    addMsg("note", "Headset on: press play/pause on your headphones to start and stop talking.");
  } catch (e) { addMsg("note", "Couldn't take over the headphone button on this browser."); }
};

// ---------- start ----------
function hello() {
  const h = new Date().getHours();
  addMsg("note", `Good ${h < 12 ? "morning" : h < 18 ? "afternoon" : "evening"}, sir. Tap the orb and speak.`);
}
showVoice();
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(() => {}); }
(async () => {
  if (PASS && await tryPass(PASS).catch(() => true)) { $("gate").classList.add("hidden"); hello(); }
  else showGate("");
})();
</script>
</body>
</html>
